<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="40%" stop-color="#070c18" />
      <stop offset="75%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Celestial Moon Gradient -->
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountain-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0b162c" />
      <stop offset="40%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="mountain-front" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0d1b38" />
      <stop offset="35%" stop-color="#081020" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="moon-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-nebula" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crescent Moon Mask -->
    <mask id="crescent-mask">
      <rect width="920" height="320" fill="black" />
      <circle cx="755" cy="115" r="58" fill="white" />
      <circle cx="738" cy="110" r="55" fill="black" />
    </mask>
  </defs>

  <style>
    .font-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="320" rx="14" fill="url(#banner-bg)" />
  <rect width="917" height="317" x="1.5" y="1.5" rx="13" fill="none" stroke="url(#border-glow)" stroke-width="1.2" />

  <!-- Celestial Glow Behind Moon (Nebula effect) -->
  <circle cx="755" cy="115" r="140" fill="#0284c7" opacity="0.18" filter="url(#ambient-nebula)" />
  <circle cx="755" cy="115" r="90" fill="#00d2ff" opacity="0.22" filter="url(#ambient-nebula)" />
  <circle cx="770" cy="130" r="60" fill="#38bdf8" opacity="0.30" filter="url(#moon-bloom)" />

  <!-- Stars in Sky -->
  <g fill="#ffffff">
    <circle cx="120" cy="45" r="1" opacity="0.6" />
    <circle cx="210" cy="70" r="1.2" opacity="0.7" />
    <circle cx="340" cy="35" r="0.8" opacity="0.4" />
    <circle cx="480" cy="55" r="1.1" opacity="0.8" />
    <circle cx="590" cy="40" r="1.4" opacity="0.6" />
    <circle cx="670" cy="65" r="1" opacity="0.7" />
    <circle cx="860" cy="45" r="1.3" opacity="0.9" />
    <circle cx="890" cy="95" r="0.9" opacity="0.5" />
    <circle cx="640" cy="110" r="1.2" opacity="0.5" />
    <circle cx="530" cy="130" r="0.7" opacity="0.4" />
    <circle cx="160" cy="140" r="0.9" opacity="0.5" />
    <circle cx="280" cy="160" r="1.1" opacity="0.6" />
    <circle cx="80" cy="85" r="1" opacity="0.5" />
  </g>

  <!-- Crescent Moon -->
  <circle cx="755" cy="115" r="58" fill="url(#moon-grad)" mask="url(#crescent-mask)" filter="url(#moon-bloom)" />
  <circle cx="755" cy="115" r="58" fill="#ffffff" mask="url(#crescent-mask)" opacity="0.9" />

  <!-- Distant Mountain Ridge -->
  <polygon points="520,320 620,245 680,265 745,210 820,250 880,225 920,260 920,320" fill="url(#mountain-grad)" opacity="0.7" />

  <!-- Main Foreground Mountain Peak -->
  <!-- Peak Summit is at (736, 172) -->
  <polygon points="560,320 640,255 700,215 736,172 755,200 790,235 835,220 920,305 920,320" fill="url(#mountain-front)" />

  <!-- Summit Blue Rim Light -->
  <polyline points="670,232 700,215 736,172 755,200 790,235" fill="none" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#text-glow)" />

  <!-- Mountain Shading Ridges -->
  <path d="M 736 172 L 720 230 L 685 270 L 650 320" stroke="#040812" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 736 172 L 755 220 L 780 270 L 810 320" stroke="#03060d" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Solitary Person Standing at Mountain Summit (736, 172) -->
  <g transform="translate(736, 172)">
    <!-- Cyan Rim Highlight on Person -->
    <ellipse cx="0" cy="-21" rx="2.5" ry="3" fill="#00d2ff" opacity="0.8" filter="url(#text-glow)" />
    <!-- Head -->
    <ellipse cx="0" cy="-21" rx="2.5" ry="3" fill="#020306" />
    <!-- Torso / Coat -->
    <path d="M -3 -18 L 3 -18 L 4 -8 L -4 -8 Z" fill="#020306" />
    <!-- Blue edge on shoulder facing moon -->
    <path d="M 2 -18 L 3.5 -18 L 4 -8 L 3 -8 Z" fill="#38bdf8" opacity="0.7" />
    <!-- Legs -->
    <path d="M -3 -8 L -4 0 L -2 0 L -1 -8 Z" fill="#020306" />
    <path d="M 1 -8 L 2 0 L 4 0 L 3 -8 Z" fill="#020306" />
    <!-- Looking up toward moon angle -->
    <line x1="2" y1="-21" x2="3.5" y2="-22" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Typography Left Block (Centered at x = 330) -->
  <!-- Line 1: Turning Ideas into Impact, -->
  <g class="font-main" transform="translate(330, 100)">
    <text text-anchor="middle" font-size="34px" font-weight="300" letter-spacing="1px">
      <tspan fill="#ffffff" font-weight="300">Turning </tspan>
      <tspan fill="#00d2ff" font-weight="700" filter="url(#text-glow)">Ideas</tspan>
      <tspan fill="#ffffff" font-weight="300"> into </tspan>
      <tspan fill="#38bdf8" font-weight="700">Impact,</tspan>
    </text>
  </g>

  <!-- Line 2: ONE LINE OF CODE AT A TIME. -->
  <g class="font-main" transform="translate(330, 142)">
    <text text-anchor="middle" font-size="19px" font-weight="600" letter-spacing="5.5px">
      <tspan fill="#e2e8f0">ONE LINE OF </tspan>
      <tspan fill="#00d2ff" font-weight="800" filter="url(#text-glow)">CODE</tspan>
      <tspan fill="#e2e8f0"> AT A TIME.</tspan>
    </text>
  </g>

  <!-- Line 3: Tech Divider Line with </> -->
  <g transform="translate(330, 182)">
    <!-- Left Divider Line -->
    <line x1="-190" y1="0" x2="-45" y2="0" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-140" y1="0" x2="-45" y2="0" stroke="#0070f3" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
    
    <!-- Center Tech Symbol </> -->
    <text x="0" y="6" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="20px" font-weight="700" fill="#00d2ff" filter="url(#text-glow)">&lt;/&gt;</text>
    
    <!-- Right Divider Line -->
    <line x1="45" y1="0" x2="140" y2="0" stroke="#0070f3" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="45" y1="0" x2="190" y2="0" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Line 4: LEARN · BUILD · SOLVE · GROW · REPEAT -->
  <g class="font-main" transform="translate(330, 224)">
    <text text-anchor="middle" font-size="12px" font-weight="600" letter-spacing="6px" fill="#94a3b8">
      LEARN  ·  BUILD  ·  SOLVE  ·  GROW  ·  REPEAT
    </text>
  </g>
</svg>
